<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Afrikaans HT · V1: Woordvorming, klanke en spelling" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">AFRIKAANS HT · V1</text>
<text x="24" y="60" font-size="27" fill="#ffffff" font-weight="900">Woordvorming, klanke en spelling</text>
<rect x="24" y="100" width="752" height="106" rx="12" fill="#0e2a1a" stroke="#5cc8ff" stroke-width="3"/>
<circle cx="54" cy="153.0" r="17" fill="#5cc8ff"/><text x="54" y="161.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">1</text>
<text x="84" y="132" font-size="19" fill="#ffffff" font-weight="700">Stam: haal voor- en agtervoegsels af (on-vriend-e-lik → vriend)</text>
<text x="84" y="160" font-size="19" fill="#ffffff" font-weight="700">· samestelling = stam + stam · afleiding = stam +</text>
<text x="84" y="188" font-size="19" fill="#ffffff" font-weight="700">voor-/agtervoegsel</text>
<rect x="24" y="218" width="752" height="78" rx="12" fill="#0e2a1a" stroke="#ff6b57" stroke-width="3"/>
<circle cx="54" cy="257.0" r="17" fill="#ff6b57"/><text x="54" y="265.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">2</text>
<text x="84" y="250" font-size="19" fill="#ffffff" font-weight="700">Teenwoordige deelwoord: stam + -end(e): spelend, golf → golwend</text>
<text x="84" y="278" font-size="19" fill="#ffffff" font-weight="700">(f → w) · intensief: yskoud, doodmoeg</text>
<rect x="24" y="308" width="752" height="78" rx="12" fill="#0e2a1a" stroke="#f2c94c" stroke-width="3"/>
<circle cx="54" cy="347.0" r="17" fill="#f2c94c"/><text x="54" y="355.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">3</text>
<text x="84" y="340" font-size="19" fill="#ffffff" font-weight="700">Lettergrepe: een klinkerklank per greep (ge-sond-heid) ·</text>
<text x="84" y="368" font-size="19" fill="#ffffff" font-weight="700">tweeklank: ei, y, ui, ou, eu (klein, ys, huis, koud, neus)</text>
<rect x="24" y="398" width="752" height="78" rx="12" fill="#0e2a1a" stroke="#7ee08a" stroke-width="3"/>
<circle cx="54" cy="437.0" r="17" fill="#7ee08a"/><text x="54" y="445.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">4</text>
<text x="84" y="430" font-size="19" fill="#ffffff" font-weight="700">Deelteken (ë, ï) wys &#x27;n nuwe lettergreep: geëet, opvlieënd ·</text>
<text x="84" y="458" font-size="19" fill="#ffffff" font-weight="700">pleonasme = onnodige herhaling (eerste debuut)</text>
</svg>
