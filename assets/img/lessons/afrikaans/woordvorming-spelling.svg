<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" aria-label="Afrikaans HT · V1: Woordvorming en spelling" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="530" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">AFRIKAANS HT · V1</text>
<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">Woordvorming en spelling</text>
<rect x="24" y="120" width="752" height="86" rx="12" fill="#0e2a1a" stroke="#5cc8ff" stroke-width="3"/>
<circle cx="56" cy="163.0" r="18" fill="#5cc8ff"/><text x="56" y="171.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">1</text>
<text x="88" y="156" font-size="21" fill="#ffffff" font-weight="700">Stam: haal voor- en agtervoegsels af (on-vriend-e-lik →</text>
<text x="88" y="186" font-size="21" fill="#ffffff" font-weight="700">vriend)</text>
<rect x="24" y="220" width="752" height="86" rx="12" fill="#0e2a1a" stroke="#ff6b57" stroke-width="3"/>
<circle cx="56" cy="263.0" r="18" fill="#ff6b57"/><text x="56" y="271.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">2</text>
<text x="88" y="256" font-size="21" fill="#ffffff" font-weight="700">Samestelling = stam + stam · afleiding = stam + voor- of</text>
<text x="88" y="286" font-size="21" fill="#ffffff" font-weight="700">agtervoegsel</text>
<rect x="24" y="320" width="752" height="86" rx="12" fill="#0e2a1a" stroke="#f2c94c" stroke-width="3"/>
<circle cx="56" cy="363.0" r="18" fill="#f2c94c"/><text x="56" y="371.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">3</text>
<text x="88" y="356" font-size="21" fill="#ffffff" font-weight="700">Teenwoordige deelwoord: stam + -ende (spelende) · intensief:</text>
<text x="88" y="386" font-size="21" fill="#ffffff" font-weight="700">yskoud, doodmoeg</text>
<rect x="24" y="420" width="752" height="86" rx="12" fill="#0e2a1a" stroke="#7ee08a" stroke-width="3"/>
<circle cx="56" cy="463.0" r="18" fill="#7ee08a"/><text x="56" y="471.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">4</text>
<text x="88" y="456" font-size="21" fill="#ffffff" font-weight="700">Lettergrepe: een klinkerklank per greep (ge-sond-heid) ·</text>
<text x="88" y="486" font-size="21" fill="#ffffff" font-weight="700">tweeklank: ei, ui, ou, eu</text>
</svg>
