<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Afrikaans HT · V1: Betekenis" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">AFRIKAANS HT · V1</text>
<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">Betekenis</text>
<rect x="24" y="120" width="752" height="86" rx="12" fill="#0e2a1a" stroke="#5cc8ff" stroke-width="3"/>
<circle cx="56" cy="163.0" r="18" fill="#5cc8ff"/><text x="56" y="171.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">1</text>
<text x="88" y="156" font-size="21" fill="#ffffff" font-weight="700">Homoniem: selfde woord, ander betekenis (bank) · sinoniem =</text>
<text x="88" y="186" font-size="21" fill="#ffffff" font-weight="700">selfde · antoniem = teenoorgesteld</text>
<rect x="24" y="220" width="752" height="56" rx="12" fill="#0e2a1a" stroke="#ff6b57" stroke-width="3"/>
<circle cx="56" cy="248.0" r="18" fill="#ff6b57"/><text x="56" y="256.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">2</text>
<text x="88" y="256" font-size="21" fill="#ffffff" font-weight="700">Verklarende sin: die sin moet die betekenis bewys</text>
<rect x="24" y="290" width="752" height="86" rx="12" fill="#0e2a1a" stroke="#f2c94c" stroke-width="3"/>
<circle cx="56" cy="333.0" r="18" fill="#f2c94c"/><text x="56" y="341.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">3</text>
<text x="88" y="326" font-size="21" fill="#ffffff" font-weight="700">Neutraal: woedend → kwaad · denotasie = woordeboek ·</text>
<text x="88" y="356" font-size="21" fill="#ffffff" font-weight="700">konnotasie = gevoel</text>
<rect x="24" y="390" width="752" height="56" rx="12" fill="#0e2a1a" stroke="#7ee08a" stroke-width="3"/>
<circle cx="56" cy="418.0" r="18" fill="#7ee08a"/><text x="56" y="426.0" font-size="22" fill="#10140f" font-weight="900" text-anchor="middle">4</text>
<text x="88" y="426" font-size="21" fill="#ffffff" font-weight="700">Idioom: ken die vaste vorm én die betekenis</text>
</svg>
