<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 582" width="800" height="582" role="img" aria-label="Afrikaans HT · V1: Sinsveranderinge wat elke jaar kom" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="582" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">AFRIKAANS HT · V1</text>
<text x="24" y="60" font-size="27" fill="#ffffff" font-weight="900">Sinsveranderinge wat elke jaar kom</text>
<rect x="24" y="100" width="752" height="134" rx="12" fill="#0e2a1a" stroke="#5cc8ff" stroke-width="3"/>
<circle cx="54" cy="167.0" r="17" fill="#5cc8ff"/><text x="54" y="175.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">1</text>
<text x="84" y="132" font-size="19" fill="#ffffff" font-weight="700">Lydend: voorwerp vorentoe + word (nou) / is (verlede) + deur …;</text>
<text x="84" y="160" font-size="19" fill="#ffffff" font-weight="700">ge- by die ww, maar nie by be-, ver-, her-, ont- nie</text>
<text x="84" y="188" font-size="19" fill="#ffffff" font-weight="700">(voorberei). Geen voorwerp? Daar word … (Daar word sleg</text>
<text x="84" y="216" font-size="19" fill="#ffffff" font-weight="700">geslaap.)</text>
<rect x="24" y="246" width="752" height="78" rx="12" fill="#0e2a1a" stroke="#ff6b57" stroke-width="3"/>
<circle cx="54" cy="285.0" r="17" fill="#ff6b57"/><text x="54" y="293.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">2</text>
<text x="84" y="278" font-size="19" fill="#ffffff" font-weight="700">Ontkenning: dubbele nie; iemand → niemand, iets → niks, altyd →</text>
<text x="84" y="306" font-size="19" fill="#ffffff" font-weight="700">nooit</text>
<rect x="24" y="336" width="752" height="106" rx="12" fill="#0e2a1a" stroke="#f2c94c" stroke-width="3"/>
<circle cx="54" cy="389.0" r="17" fill="#f2c94c"/><text x="54" y="397.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">3</text>
<text x="84" y="368" font-size="19" fill="#ffffff" font-weight="700">Indirekte rede: dat + ww agter; ek → hy/sy; is → was, kan → kon,</text>
<text x="84" y="396" font-size="19" fill="#ffffff" font-weight="700">sal → sou; hier → daar, vandag → daardie dag, gister → die</text>
<text x="84" y="424" font-size="19" fill="#ffffff" font-weight="700">vorige dag, môre → die volgende dag; vraag → of</text>
<rect x="24" y="454" width="752" height="106" rx="12" fill="#0e2a1a" stroke="#7ee08a" stroke-width="3"/>
<circle cx="54" cy="507.0" r="17" fill="#7ee08a"/><text x="54" y="515.0" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">4</text>
<text x="84" y="486" font-size="19" fill="#ffffff" font-weight="700">Bysinne (ww agter): byvoeglik (wat/wie: beskryf &#x27;n naamwoord) ·</text>
<text x="84" y="514" font-size="19" fill="#ffffff" font-weight="700">bywoordelik (omdat, toe, as: rede/tyd/voorwaarde) ·</text>
<text x="84" y="542" font-size="19" fill="#ffffff" font-weight="700">naamwoordelik (dat, of) · want/en/maar: woordorde bly</text>
</svg>
