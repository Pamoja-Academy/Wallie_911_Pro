<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Lewensoriëntering · Eksamentegniek: Antwoord-trap: nie stort nie" font-family="Arial, Helvetica, sans-serif">
<defs></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#f2c94c"/><rect y="50" width="800" height="22" fill="#f2c94c"/>
<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">LEWENSORIËNTERING · EKSAMENTEGNIEK</text>
<text x="24" y="60" font-size="29" fill="#1a1400" font-weight="900">Antwoord-trap: nie stort nie</text>

    <rect x="24" y="92" width="470" height="120" rx="10" fill="#f4f1e8"/>
    <text x="42" y="126" font-size="16" fill="#6b7f72" font-weight="700" letter-spacing="2">Vraag</text>
    <text x="42" y="158" font-size="20" fill="#10140f" font-weight="700"><tspan x="42" dy="0">Bespreek hoe Thabo se maats sy</tspan><tspan x="42" dy="26">keuses oor alkohol beïnvloed.   (4)</tspan></text>
    <rect x="514" y="104" width="262" height="46" rx="23" fill="#f2c94c"/><text x="645" y="134.2" font-size="20" fill="#10140f" font-weight="800" text-anchor="middle">(4) = 2 punte × 2</text>
    <text x="524" y="182" font-size="18" fill="#b9d0c0" font-weight="600"><tspan x="524" dy="0">elke punt: idee +</tspan><tspan x="524" dy="22">uitbreiding</tspan></text>
    <rect x="24" y="382" width="236" height="118" rx="10" fill="#0a8f5a"/>
    <circle cx="56" cy="414" r="22" fill="#fff"/><text x="56" y="422.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">1</text><text x="86" y="422" font-size="21" fill="#fff" font-weight="900">STELLING</text>
    <text x="44" y="456" font-size="17" fill="#fff" font-weight="600"><tspan x="44" dy="0">Wat is dit? 1 sin.</tspan><tspan x="44" dy="22">bv. Groepsdruk is …</tspan></text>
    <rect x="276" y="306" width="236" height="194" rx="10" fill="#d08b16"/>
    <circle cx="308" cy="338" r="22" fill="#fff"/><text x="308" y="346.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">2</text><text x="338" y="346" font-size="21" fill="#fff" font-weight="900">TOEPASSING</text>
    <text x="296" y="380" font-size="17" fill="#fff" font-weight="600"><tspan x="296" dy="0">Koppel aan die</tspan><tspan x="296" dy="22">scenario: noem</tspan><tspan x="296" dy="22">Thabo by naam.</tspan></text>
    <rect x="528" y="230" width="248" height="270" rx="10" fill="#d4472f"/>
    <circle cx="560" cy="262" r="22" fill="#fff"/><text x="560" y="270.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">3</text><text x="590" y="270" font-size="21" fill="#fff" font-weight="900">VOORBEELD</text>
    <text x="548" y="304" font-size="17" fill="#fff" font-weight="600"><tspan x="548" dy="0">Wat gebeur dan?</tspan><tspan x="548" dy="22">bv. hy drink om in</tspan><tspan x="548" dy="22">te pas → swak</tspan><tspan x="548" dy="22">punte, gevaar.</tspan></text>
    <path d="M740,230 v-40" stroke="#fff" stroke-width="4"/><path d="M740,190 l30,10 l-30,10 z" fill="#f2c94c"/>
    <text x="24" y="300" font-size="19" fill="#ff6b57" font-weight="700"><tspan x="24" dy="0">✗ Moenie ‘alles wat ek</tspan><tspan x="24" dy="24">weet’ skryf nie.</tspan></text>
</svg>
