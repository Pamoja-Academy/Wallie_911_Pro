<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Lewensoriëntering · Loopbane: Van skool na werk / studie" font-family="Arial, Helvetica, sans-serif">
<defs></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#f2c94c"/><rect y="50" width="800" height="22" fill="#f2c94c"/>
<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">LEWENSORIËNTERING · LOOPBANE</text>
<text x="24" y="60" font-size="29" fill="#1a1400" font-weight="900">Van skool na werk / studie</text>

    <line x1="86" y1="160" x2="714" y2="160" stroke="#2f6b47" stroke-width="10"/>
    <circle cx="86" cy="160" r="34" fill="#f2c94c"/><text x="86" y="172.92" font-size="35.7" fill="#10140f" font-weight="900" text-anchor="middle">1</text><text x="86" y="228" font-size="19" fill="#f6f8f3" font-weight="700" text-anchor="middle">Ken jouself</text><text x="86" y="256" font-size="15" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="86" dy="0">belangstelling,</tspan><tspan x="86" dy="19">vaardighede</tspan></text><circle cx="243" cy="160" r="34" fill="#f2c94c"/><text x="243" y="172.92" font-size="35.7" fill="#10140f" font-weight="900" text-anchor="middle">2</text><text x="243" y="228" font-size="19" fill="#f6f8f3" font-weight="700" text-anchor="middle">Vind die pos</text><text x="243" y="256" font-size="15" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="243" dy="0">advertensie,</tspan><tspan x="243" dy="19">netwerk</tspan></text><circle cx="400" cy="160" r="34" fill="#f2c94c"/><text x="400" y="172.92" font-size="35.7" fill="#10140f" font-weight="900" text-anchor="middle">3</text><text x="400" y="228" font-size="19" fill="#f6f8f3" font-weight="700" text-anchor="middle">CV + dekbrief</text><text x="400" y="256" font-size="15" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="400" dy="0">kort, netjies,</tspan><tspan x="400" dy="19">geen foute</tspan></text><circle cx="557" cy="160" r="34" fill="#f2c94c"/><text x="557" y="172.92" font-size="35.7" fill="#10140f" font-weight="900" text-anchor="middle">4</text><text x="557" y="228" font-size="19" fill="#f6f8f3" font-weight="700" text-anchor="middle">Onderhoud</text><text x="557" y="256" font-size="15" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="557" dy="0">voorberei, betyds,</tspan><tspan x="557" dy="19">oogkontak</tspan></text><circle cx="714" cy="160" r="34" fill="#3ddc84"/><text x="714" y="172.92" font-size="35.7" fill="#10140f" font-weight="900" text-anchor="middle">5</text><text x="714" y="228" font-size="19" fill="#f6f8f3" font-weight="700" text-anchor="middle">Aanbod</text><text x="714" y="256" font-size="15" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="714" dy="0">lees die</tspan><tspan x="714" dy="19">kontrak</tspan></text>
    <text x="24" y="334" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">STUDIEGELD</text>
    <rect x="24" y="346" width="242" height="150" rx="14" fill="#123a24" stroke="#3ddc84" stroke-width="4"/><text x="42" y="390" font-size="26" fill="#3ddc84" font-weight="900">NSFAS</text><text x="42" y="428" font-size="17" fill="#f6f8f3" font-weight="600"><tspan x="42" dy="0">staatsbefondsing</tspan><tspan x="42" dy="23">vir studie</tspan></text><rect x="278" y="346" width="242" height="150" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="4"/><text x="296" y="390" font-size="26" fill="#f2c94c" font-weight="900">Beurs</text><text x="296" y="428" font-size="17" fill="#f6f8f3" font-weight="600"><tspan x="296" dy="0">hoef nie terug te betaal</tspan><tspan x="296" dy="23">nie (voorwaardes)</tspan></text><rect x="532" y="346" width="242" height="150" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="4"/><text x="550" y="390" font-size="26" fill="#ff6b57" font-weight="900">Studielening</text><text x="550" y="428" font-size="17" fill="#f6f8f3" font-weight="600"><tspan x="550" dy="0">betaal terug</tspan><tspan x="550" dy="23">+ rente</tspan></text>
</svg>
