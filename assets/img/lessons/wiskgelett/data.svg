    <rect x="24" y="196" width="178" height="108" rx="14" fill="#123a24" stroke="#e9efe9" stroke-width="3"/><text x="38" y="224" font-size="18" fill="#e9efe9" font-weight="900">Gemiddeld</text><text x="38" y="260" font-size="21" fill="#f6f8f3" font-weight="900">50 ÷ 7 = 7,14</text><text x="38" y="290" font-size="14" fill="#b9d0c0" font-weight="600">tel op ÷ aantal</text><rect x="214" y="196" width="178" height="108" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="3"/><text x="228" y="224" font-size="18" fill="#f2c94c" font-weight="900">Mediaan</text><text x="228" y="260" font-size="28" fill="#f6f8f3" font-weight="900">7</text><text x="228" y="290" font-size="14" fill="#b9d0c0" font-weight="600">middelste getal</text><rect x="404" y="196" width="178" height="108" rx="14" fill="#123a24" stroke="#5cc8ff" stroke-width="3"/><text x="418" y="224" font-size="18" fill="#5cc8ff" font-weight="900">Modus</text><text x="418" y="260" font-size="28" fill="#f6f8f3" font-weight="900">5</text><text x="418" y="290" font-size="14" fill="#b9d0c0" font-weight="600">kom meeste voor</text><rect x="594" y="196" width="178" height="108" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="3"/><text x="608" y="224" font-size="18" fill="#ff6b57" font-weight="900">Omvang</text><text x="608" y="260" font-size="21" fill="#f6f8f3" font-weight="900">12 − 3 = 9</text><text x="608" y="290" font-size="14" fill="#b9d0c0" font-weight="600">grootste − kleinste</text>
    <text x="24" y="340" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">MOND-EN-SNOR (BOX-AND-WHISKER)</text>
