<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">Gemiddeld · mediaan · modus · omvang</text>

    <text x="24" y="108" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">1. SORTEER EERS</text>
