    <text x="399" y="362" font-size="15" fill="#f2c94c" font-weight="700" text-anchor="middle">Q2 = 7</text><text x="540" y="362" font-size="15" fill="#5cc8ff" font-weight="700" text-anchor="middle">Q3 = 10</text>
    <text x="634" y="366" font-size="15" fill="#f6f8f3" font-weight="700" text-anchor="middle">maks 12</text>
    <text x="776" y="412" font-size="16" fill="#f6f8f3" font-weight="700" text-anchor="end"><tspan x="776" dy="0">IKO = Q3 − Q1</tspan><tspan x="776" dy="20">= 10 − 5 = 5</tspan></text>
