<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Wiskundige Geletterdheid · Datahantering: Gemiddeld · mediaan · modus · omvang" font-family="Arial, Helvetica, sans-serif">
<defs></defs>
