<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Wiskundige Geletterdheid · Finansies: BTW 15%: maal of deel deur 1,15" font-family="Arial, Helvetica, sans-serif">
