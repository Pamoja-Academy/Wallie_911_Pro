<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#0a8f5a"/><rect y="50" width="800" height="22" fill="#0a8f5a"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">WISKUNDIGE GELETTERDHEID · FINANSIES</text>
<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">BTW 15%: maal of deel deur 1,15</text>

    <rect x="40" y="120" width="250" height="150" rx="14" fill="#123a24" stroke="#5cc8ff" stroke-width="4"/>
