    <text x="165" y="246" font-size="44" fill="#f6f8f3" font-weight="900" text-anchor="middle">R300</text>
    <rect x="510" y="120" width="250" height="150" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="4"/>
    <text x="635" y="160" font-size="20" fill="#f2c94c" font-weight="900" text-anchor="middle">MET BTW</text>
    <text x="635" y="192" font-size="16" fill="#b9d0c0" font-weight="700" text-anchor="middle">(incl)</text>
    <text x="635" y="246" font-size="44" fill="#f6f8f3" font-weight="900" text-anchor="middle">R345</text>
    <line x1="300" y1="160" x2="498" y2="160" stroke="#3ddc84" stroke-width="6" stroke-linecap="round" marker-end="url(#ah3ddc84)"/><text x="400" y="146" font-size="26" fill="#3ddc84" font-weight="900" text-anchor="middle">× 1,15</text>
