    <text x="494" y="160" font-size="17" fill="#f6f8f3" font-weight="600"><tspan x="494" dy="0">Elke rand word weer en</tspan><tspan x="494" dy="22">weer gespandeer → méér</tspan><tspan x="494" dy="22">inkomste en werk.</tspan></text>
