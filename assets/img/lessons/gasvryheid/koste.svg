<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Gasvryheidstudie · Kosteberekening: Van resep tot verkoopprys" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ahf2c94c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c94c"/></marker></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">GASVRYHEIDSTUDIE · KOSTEBEREKENING</text>
<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">Van resep tot verkoopprys</text>

    <rect x="24" y="96" width="168" height="230" rx="14" fill="#123a24" stroke="#2f6b47" stroke-width="3"/><circle cx="108" cy="128" r="22" fill="#f2c94c"/><text x="108" y="136.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">1</text><text x="108" y="186" font-size="21" fill="#f6f8f3" font-weight="700" text-anchor="middle">Totale koste</text><text x="108" y="216" font-size="17" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="108" dy="0">tel alle</tspan><tspan x="108" dy="21">bestanddele op</tspan></text><text x="108" y="300" font-size="34" fill="#f2c94c" font-weight="900" text-anchor="middle">R240</text><rect x="220" y="96" width="168" height="230" rx="14" fill="#123a24" stroke="#2f6b47" stroke-width="3"/><circle cx="304" cy="128" r="22" fill="#f2c94c"/><text x="304" y="136.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">2</text><text x="304" y="186" font-size="21" fill="#f6f8f3" font-weight="700" text-anchor="middle">Per porsie</text><text x="304" y="216" font-size="17" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="304" dy="0">÷ aantal porsies</tspan><tspan x="304" dy="21">(8 porsies)</tspan></text><text x="304" y="300" font-size="34" fill="#f2c94c" font-weight="900" text-anchor="middle">R30</text><rect x="416" y="96" width="168" height="230" rx="14" fill="#123a24" stroke="#2f6b47" stroke-width="3"/><circle cx="500" cy="128" r="22" fill="#f2c94c"/><text x="500" y="136.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">3</text><text x="500" y="186" font-size="21" fill="#f6f8f3" font-weight="700" text-anchor="middle">+ Wins-%</text><text x="500" y="216" font-size="17" fill="#b9d0c0" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">R30 + 150%</tspan><tspan x="500" dy="21">(R45 wins)</tspan></text><text x="500" y="300" font-size="34" fill="#f2c94c" font-weight="900" text-anchor="middle">R75</text><rect x="612" y="96" width="168" height="230" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="3"/><circle cx="696" cy="128" r="22" fill="#f2c94c"/><text x="696" y="136.36" font-size="23.1" fill="#10140f" font-weight="900" text-anchor="middle">4</text><text x="696" y="186" font-size="21" fill="#f6f8f3" font-weight="700" text-anchor="middle">+ BTW 15%</text><text x="696" y="216" font-size="17" fill="#b9d0c0" font-weight="600" text-anchor="middle">R75 × 1,15</text><text x="696" y="300" font-size="34" fill="#f2c94c" font-weight="900" text-anchor="middle">R86,25</text>
    <line x1="194" y1="210" x2="216" y2="210" stroke="#f2c94c" stroke-width="4" stroke-linecap="round" marker-end="url(#ahf2c94c)"/><line x1="390" y1="210" x2="412" y2="210" stroke="#f2c94c" stroke-width="4" stroke-linecap="round" marker-end="url(#ahf2c94c)"/><line x1="586" y1="210" x2="608" y2="210" stroke="#f2c94c" stroke-width="4" stroke-linecap="round" marker-end="url(#ahf2c94c)"/>
    <rect x="24" y="346" width="360" height="150" rx="14" fill="#3a1712" stroke="#ff6b57" stroke-width="3"/>
    <text x="44" y="384" font-size="22" fill="#ff6b57" font-weight="900">LEES DIE VRAAG!</text>
    <text x="44" y="418" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="44" dy="0">Wins-% (opmerking op koste)</tspan><tspan x="44" dy="25">≠ voedselkoste-% van prys.</tspan><tspan x="44" dy="25">Watter een vra hulle?</tspan></text>
    <rect x="404" y="346" width="372" height="150" rx="14" fill="#0c2a19" stroke="#3ddc84" stroke-width="3"/>
    <text x="424" y="384" font-size="22" fill="#3ddc84" font-weight="900">Voedselkoste-%</text>
    <text x="424" y="418" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="424" dy="0">= koste ÷ verkoopprys × 100</tspan><tspan x="424" dy="25">= 30 ÷ 75 × 100</tspan><tspan x="424" dy="25">= 40%</tspan></text>
</svg>
