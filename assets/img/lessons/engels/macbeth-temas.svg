<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="English FAL · Macbeth: themes and how the questions ask" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#f2c94c"/><rect y="50" width="800" height="22" fill="#f2c94c"/>
<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">ENGLISH FAL · MACBETH</text>
<text x="24" y="60" font-size="26" fill="#1a1400" font-weight="900">themes and how the questions ask</text>
<rect x="24" y="92" width="752" height="94" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="3"/><circle cx="66" cy="139" r="26" fill="#f2c94c"/><text x="66" y="150" font-size="30" fill="#10140f" font-weight="900" text-anchor="middle">1</text><text x="108" y="133" font-size="18" fill="#f6f8f3" font-weight="600">Ambition: unchecked ambition destroys Macbeth and Scotland ·</text><text x="108" y="157" font-size="18" fill="#f6f8f3" font-weight="600">fate vs free will: Macbeth CHOOSES to kill</text>
<rect x="24" y="196" width="752" height="94" rx="14" fill="#123a24" stroke="#5cc8ff" stroke-width="3"/><circle cx="66" cy="243" r="26" fill="#5cc8ff"/><text x="66" y="254" font-size="30" fill="#10140f" font-weight="900" text-anchor="middle">2</text><text x="108" y="237" font-size="18" fill="#f6f8f3" font-weight="600">Appearance vs reality: “look like th’ innocent flower, but be</text><text x="108" y="261" font-size="18" fill="#f6f8f3" font-weight="600">the serpent under’t”</text>
<rect x="24" y="300" width="752" height="94" rx="14" fill="#123a24" stroke="#3ddc84" stroke-width="3"/><circle cx="66" cy="347" r="26" fill="#3ddc84"/><text x="66" y="358" font-size="30" fill="#10140f" font-weight="900" text-anchor="middle">3</text><text x="108" y="353" font-size="18" fill="#f6f8f3" font-weight="600">Guilt: blood and sleeplessness (“Macbeth does murder sleep”)</text>
<rect x="24" y="404" width="752" height="94" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="3"/><circle cx="66" cy="451" r="26" fill="#ff6b57"/><text x="66" y="462" font-size="30" fill="#10140f" font-weight="900" text-anchor="middle">4</text><text x="108" y="445" font-size="18" fill="#f6f8f3" font-weight="600">Questions: context · tone + a word as proof · dramatic irony ·</text><text x="108" y="469" font-size="18" fill="#f6f8f3" font-weight="600">Do you agree? = opinion + reason</text>
</svg>
