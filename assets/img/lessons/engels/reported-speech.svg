<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">ENGLISH FAL · LANGUAGE</text>
<text x="24" y="60" font-size="29" fill="#1a1400" font-weight="900">Reported speech: step back in time</text>

    <text x="28" y="110" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">DIRECT</text>
    <rect x="24" y="118" width="752" height="58" rx="14" fill="#123a24" stroke="#2f6b47" stroke-width="3"/>
    <text x="44" y="156" font-size="26" font-weight="700"><tspan fill="#f6f8f3">She said, “</tspan><tspan fill="#5cc8ff">I</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#ff6b57">am</tspan><tspan fill="#f6f8f3"> tired </tspan><tspan fill="#f2c94c">today</tspan><tspan fill="#f6f8f3">.”</tspan></text>
    <line x1="400" y1="182" x2="400" y2="206" stroke="#f2c94c" stroke-width="5" stroke-linecap="round" marker-end="url(#ahf2c94c)"/>
    <text x="28" y="222" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">REPORTED</text>
    <rect x="24" y="230" width="752" height="58" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="3"/>
    <text x="44" y="268" font-size="26" font-weight="700"><tspan fill="#f6f8f3">She said (that) </tspan><tspan fill="#5cc8ff">she</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#ff6b57">was</tspan><tspan fill="#f6f8f3"> tired </tspan><tspan fill="#f2c94c">that day</tspan><tspan fill="#f6f8f3">.</tspan></text>
    <text x="44" y="328" font-size="19" fill="#ff6b57" font-weight="700">am / is</text><text x="220" y="328" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="254" y="328" font-size="19" fill="#f6f8f3" font-weight="700">was</text><text x="44" y="361" font-size="19" fill="#ff6b57" font-weight="700">are</text><text x="220" y="361" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="254" y="361" font-size="19" fill="#f6f8f3" font-weight="700">were</text><text x="44" y="394" font-size="19" fill="#ff6b57" font-weight="700">will</text><text x="220" y="394" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="254" y="394" font-size="19" fill="#f6f8f3" font-weight="700">would</text><text x="44" y="427" font-size="19" fill="#ff6b57" font-weight="700">can</text><text x="220" y="427" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="254" y="427" font-size="19" fill="#f6f8f3" font-weight="700">could</text><text x="44" y="460" font-size="19" fill="#ff6b57" font-weight="700">do / does</text><text x="220" y="460" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="254" y="460" font-size="19" fill="#f6f8f3" font-weight="700">did</text><text x="44" y="493" font-size="19" fill="#ff6b57" font-weight="700">did / have done</text><text x="220" y="493" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="254" y="493" font-size="19" fill="#f6f8f3" font-weight="700">had done</text>
    <rect x="24" y="300" width="380" height="204" rx="14" fill="none" stroke="#ff6b57" stroke-width="2"/>
    <rect x="420" y="300" width="356" height="204" rx="14" fill="none" stroke="#f2c94c" stroke-width="2"/>
    <text x="438" y="332" font-size="19" fill="#f2c94c" font-weight="700">today</text><text x="560" y="332" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="592" y="332" font-size="19" fill="#f6f8f3" font-weight="700">that day</text><text x="438" y="371" font-size="19" fill="#f2c94c" font-weight="700">tomorrow</text><text x="560" y="371" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="592" y="371" font-size="19" fill="#f6f8f3" font-weight="700">the next day</text><text x="438" y="410" font-size="19" fill="#f2c94c" font-weight="700">yesterday</text><text x="560" y="410" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="592" y="410" font-size="19" fill="#f6f8f3" font-weight="700">the day before</text><text x="438" y="449" font-size="19" fill="#f2c94c" font-weight="700">here</text><text x="560" y="449" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="592" y="449" font-size="19" fill="#f6f8f3" font-weight="700">there</text><text x="438" y="488" font-size="19" fill="#f2c94c" font-weight="700">now</text><text x="560" y="488" font-size="19" fill="#b9d0c0" font-weight="700">→</text><text x="592" y="488" font-size="19" fill="#f6f8f3" font-weight="700">then</text>
