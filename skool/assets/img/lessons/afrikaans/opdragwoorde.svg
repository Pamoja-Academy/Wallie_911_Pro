<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Afrikaans HT · Eksamentegniek: Opdragwoorde: wat wil hulle hê?" font-family="Arial, Helvetica, sans-serif">
<defs></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">AFRIKAANS HT · EKSAMENTEGNIEK</text>
<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">Opdragwoorde: wat wil hulle hê?</text>
<rect x="26" y="92" width="240" height="192" rx="14" fill="#123a24" stroke="#5cc8ff" stroke-width="4"/><text x="44" y="138" font-size="27" fill="#5cc8ff" font-weight="900">NOEM / LYS</text><text x="44" y="178" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="44" dy="0">Net die feit.</tspan><tspan x="44" dy="25">Geen rede nie.</tspan></text><rect x="44" y="230" width="204" height="38" rx="19" fill="#5cc8ff"/><text x="146" y="255.48" font-size="18" fill="#10140f" font-weight="800" text-anchor="middle">1 feit = 1 punt</text><rect x="280" y="92" width="240" height="192" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="4"/><text x="298" y="138" font-size="27" fill="#f2c94c" font-weight="900">VERDUIDELIK</text><text x="298" y="178" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="298" dy="0">Hoe of waarom?</tspan><tspan x="298" dy="25">Gebruik ‘omdat’.</tspan></text><rect x="298" y="230" width="204" height="38" rx="19" fill="#f2c94c"/><text x="400" y="255.48" font-size="18" fill="#10140f" font-weight="800" text-anchor="middle">feit + rede</text><rect x="534" y="92" width="240" height="192" rx="14" fill="#123a24" stroke="#3ddc84" stroke-width="4"/><text x="552" y="138" font-size="27" fill="#3ddc84" font-weight="900">BESPREEK</text><text x="552" y="178" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="552" dy="0">Meer as een kant</tspan><tspan x="552" dy="25">of aspek.</tspan></text><rect x="552" y="230" width="204" height="38" rx="19" fill="#3ddc84"/><text x="654" y="255.48" font-size="18" fill="#10140f" font-weight="800" text-anchor="middle">2+ punte</text><rect x="26" y="298" width="240" height="192" rx="14" fill="#123a24" stroke="#c9a2ff" stroke-width="4"/><text x="44" y="344" font-size="27" fill="#c9a2ff" font-weight="900">MOTIVEER</text><text x="44" y="384" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="44" dy="0">Gee ’n rede of</tspan><tspan x="44" dy="25">bewys uit die teks.</tspan></text><rect x="44" y="436" width="204" height="38" rx="19" fill="#c9a2ff"/><text x="146" y="461.48" font-size="18" fill="#10140f" font-weight="800" text-anchor="middle">staaf dit</text><rect x="280" y="298" width="240" height="192" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="4"/><text x="298" y="344" font-size="27" fill="#ff6b57" font-weight="900">VERGELYK</text><text x="298" y="384" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="298" dy="0">Ooreenkoms én</tspan><tspan x="298" dy="25">verskil.</tspan></text><rect x="298" y="436" width="204" height="38" rx="19" fill="#ff6b57"/><text x="400" y="461.48" font-size="18" fill="#10140f" font-weight="800" text-anchor="middle">albei kante</text><rect x="534" y="298" width="240" height="192" rx="14" fill="#123a24" stroke="#ffffff" stroke-width="4"/><text x="552" y="344" font-size="27" fill="#ffffff" font-weight="900">HAAL AAN</text><text x="552" y="384" font-size="19" fill="#f6f8f3" font-weight="700"><tspan x="552" dy="0">Presiese woorde</tspan><tspan x="552" dy="25">in ‘aanhalings’.</tspan></text><rect x="552" y="436" width="204" height="38" rx="19" fill="#ffffff"/><text x="654" y="461.48" font-size="18" fill="#10140f" font-weight="800" text-anchor="middle">kopieer net</text>
</svg>
