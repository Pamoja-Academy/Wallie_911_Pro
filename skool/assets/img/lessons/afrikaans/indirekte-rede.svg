<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Afrikaans HT · Taal: Direkte → indirekte rede" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ahf2c94c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c94c"/></marker></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#d4472f"/><rect y="50" width="800" height="22" fill="#d4472f"/>
<text x="24" y="27" font-size="15" fill="#ffffff" font-weight="800" letter-spacing="2">AFRIKAANS HT · TAAL</text>
<text x="24" y="60" font-size="29" fill="#ffffff" font-weight="900">Direkte → indirekte rede</text>

    <text x="28" y="112" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">DIREK</text>
    <rect x="24" y="120" width="752" height="64" rx="14" fill="#123a24" stroke="#2f6b47" stroke-width="3"/>
    <text x="44" y="162" font-size="26" font-weight="700"><tspan fill="#f6f8f3">Pieter het gesê: “</tspan><tspan fill="#5cc8ff">Ek</tspan><tspan fill="#ff6b57"> speel </tspan><tspan fill="#f2c94c">môre</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#3ddc84">hier</tspan><tspan fill="#f6f8f3">.”</tspan></text>
    <line x1="400" y1="192" x2="400" y2="222" stroke="#f2c94c" stroke-width="5" stroke-linecap="round" marker-end="url(#ahf2c94c)"/>
    <text x="28" y="236" font-size="16" fill="#b9d0c0" font-weight="700" letter-spacing="2">INDIREK</text>
    <rect x="24" y="244" width="752" height="64" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="3"/>
    <text x="44" y="286" font-size="24" font-weight="700"><tspan fill="#f6f8f3">Pieter het gesê </tspan><tspan fill="#c9a2ff">dat</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#5cc8ff">hy</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#f2c94c">die volgende dag</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#3ddc84">daar</tspan><tspan fill="#f6f8f3"> </tspan><tspan fill="#ff6b57">sou speel</tspan><tspan fill="#f6f8f3">.</tspan></text>
    <rect x="24" y="326" width="370" height="80" rx="14" fill="#0c2a19" stroke="#2f6b47" stroke-width="2"/><circle cx="54" cy="366" r="18" fill="#f2c94c"/><text x="54" y="372.84" font-size="18.900000000000002" fill="#10140f" font-weight="900" text-anchor="middle">1</text><text x="84" y="360" font-size="18" fill="#f6f8f3" font-weight="700"><tspan x="84" dy="0">Voeg ‘dat’ in — die werkwoord</tspan><tspan x="84" dy="24">skuif na die einde</tspan></text><rect x="406" y="326" width="370" height="80" rx="14" fill="#0c2a19" stroke="#2f6b47" stroke-width="2"/><circle cx="436" cy="366" r="18" fill="#f2c94c"/><text x="436" y="372.84" font-size="18.900000000000002" fill="#10140f" font-weight="900" text-anchor="middle">2</text><text x="466" y="360" font-size="18" fill="#f6f8f3" font-weight="700"><tspan x="466" dy="0">Voornaamwoorde: ek → hy/sy</tspan><tspan x="466" dy="24">ons → hulle · my → sy</tspan></text><rect x="24" y="416" width="370" height="80" rx="14" fill="#0c2a19" stroke="#2f6b47" stroke-width="2"/><circle cx="54" cy="456" r="18" fill="#f2c94c"/><text x="54" y="462.84" font-size="18.900000000000002" fill="#10140f" font-weight="900" text-anchor="middle">3</text><text x="84" y="450" font-size="18" fill="#f6f8f3" font-weight="700"><tspan x="84" dy="0">Verlede tyd: is → was</tspan><tspan x="84" dy="24">sal → sou · kan → kon</tspan></text><rect x="406" y="416" width="370" height="80" rx="14" fill="#0c2a19" stroke="#2f6b47" stroke-width="2"/><circle cx="436" cy="456" r="18" fill="#f2c94c"/><text x="436" y="462.84" font-size="18.900000000000002" fill="#10140f" font-weight="900" text-anchor="middle">4</text><text x="466" y="450" font-size="18" fill="#f6f8f3" font-weight="700"><tspan x="466" dy="0">hier → daar · nou → toe</tspan><tspan x="466" dy="24">môre → die volgende dag</tspan></text>
</svg>
