<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="English FAL · Literature: PEEL paragraph = full marks" font-family="Arial, Helvetica, sans-serif">
<defs></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#f2c94c"/><rect y="50" width="800" height="22" fill="#f2c94c"/>
<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">ENGLISH FAL · LITERATURE</text>
<text x="24" y="60" font-size="29" fill="#1a1400" font-weight="900">PEEL paragraph = full marks</text>
<rect x="24" y="92" width="752" height="94" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="3"/><circle cx="74" cy="139" r="34" fill="#f2c94c"/><text x="74" y="153" font-size="40" fill="#10140f" font-weight="900" text-anchor="middle">P</text><text x="126" y="132" font-size="26" fill="#f2c94c" font-weight="900">Point</text><text x="126" y="164" font-size="18" fill="#f6f8f3" font-weight="600">Answer the question in 1 sentence.</text><text x="500" y="148" font-size="18" fill="#b9d0c0" font-weight="600" font-style="italic">The speaker feels trapped.</text><rect x="24" y="196" width="752" height="94" rx="14" fill="#123a24" stroke="#5cc8ff" stroke-width="3"/><circle cx="74" cy="243" r="34" fill="#5cc8ff"/><text x="74" y="257" font-size="40" fill="#10140f" font-weight="900" text-anchor="middle">E</text><text x="126" y="236" font-size="26" fill="#5cc8ff" font-weight="900">Evidence</text><text x="126" y="268" font-size="18" fill="#f6f8f3" font-weight="600">Quote it — use “ ”.</text><text x="500" y="252" font-size="18" fill="#b9d0c0" font-weight="600" font-style="italic">“the walls close in”</text><rect x="24" y="300" width="752" height="94" rx="14" fill="#123a24" stroke="#3ddc84" stroke-width="3"/><circle cx="74" cy="347" r="34" fill="#3ddc84"/><text x="74" y="361" font-size="40" fill="#10140f" font-weight="900" text-anchor="middle">E</text><text x="126" y="340" font-size="26" fill="#3ddc84" font-weight="900">Explain</text><text x="126" y="372" font-size="18" fill="#f6f8f3" font-weight="600">HOW does the quote prove it?</text><text x="500" y="356" font-size="18" fill="#b9d0c0" font-weight="600" font-style="italic">Walls = no escape → fear.</text><rect x="24" y="404" width="752" height="94" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="3"/><circle cx="74" cy="451" r="34" fill="#ff6b57"/><text x="74" y="465" font-size="40" fill="#10140f" font-weight="900" text-anchor="middle">L</text><text x="126" y="444" font-size="26" fill="#ff6b57" font-weight="900">Link</text><text x="126" y="476" font-size="18" fill="#f6f8f3" font-weight="600">Back to the question’s key word.</text><text x="500" y="460" font-size="18" fill="#b9d0c0" font-weight="600" font-style="italic">So the poem’s tone is fearful.</text>
</svg>
