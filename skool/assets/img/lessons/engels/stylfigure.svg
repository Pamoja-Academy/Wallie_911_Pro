<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="English FAL · Poetry &amp; language: Figures of speech: name + effect" font-family="Arial, Helvetica, sans-serif">
<defs></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#f2c94c"/><rect y="50" width="800" height="22" fill="#f2c94c"/>
<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">ENGLISH FAL · POETRY &amp; LANGUAGE</text>
<text x="24" y="60" font-size="29" fill="#1a1400" font-weight="900">Figures of speech: name + effect</text>
<rect x="26" y="92" width="240" height="192" rx="14" fill="#123a24" stroke="#f2c94c" stroke-width="4"/><text x="44" y="134" font-size="24" fill="#f2c94c" font-weight="900">SIMILE</text><text x="44" y="188" font-size="20" fill="#f6f8f3" font-weight="700" font-style="italic">as brave as a lion</text><rect x="44" y="232" width="204" height="36" rx="18" fill="#f2c94c"/><text x="146" y="256.12" font-size="17" fill="#10140f" font-weight="800" text-anchor="middle">uses like / as</text><rect x="280" y="92" width="240" height="192" rx="14" fill="#123a24" stroke="#5cc8ff" stroke-width="4"/><text x="298" y="134" font-size="24" fill="#5cc8ff" font-weight="900">METAPHOR</text><text x="298" y="188" font-size="20" fill="#f6f8f3" font-weight="700" font-style="italic">He is a lion.</text><rect x="298" y="232" width="204" height="36" rx="18" fill="#5cc8ff"/><text x="400" y="256.12" font-size="17" fill="#10140f" font-weight="800" text-anchor="middle">says it IS</text><rect x="534" y="92" width="240" height="192" rx="14" fill="#123a24" stroke="#3ddc84" stroke-width="4"/><text x="552" y="134" font-size="20" fill="#3ddc84" font-weight="900">PERSONIFICATION</text><text x="552" y="188" font-size="20" fill="#f6f8f3" font-weight="700" font-style="italic">The wind whispered.</text><rect x="552" y="232" width="204" height="36" rx="18" fill="#3ddc84"/><text x="654" y="256.12" font-size="17" fill="#10140f" font-weight="800" text-anchor="middle">human action</text><rect x="26" y="298" width="240" height="192" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="4"/><text x="44" y="340" font-size="24" fill="#ff6b57" font-weight="900">HYPERBOLE</text><text x="44" y="394" font-size="20" fill="#f6f8f3" font-weight="700" font-style="italic"><tspan x="44" dy="0">I told you a million</tspan><tspan x="44" dy="26">times!</tspan></text><rect x="44" y="438" width="204" height="36" rx="18" fill="#ff6b57"/><text x="146" y="462.12" font-size="17" fill="#10140f" font-weight="800" text-anchor="middle">huge exaggeration</text><rect x="280" y="298" width="240" height="192" rx="14" fill="#123a24" stroke="#c9a2ff" stroke-width="4"/><text x="298" y="340" font-size="24" fill="#c9a2ff" font-weight="900">ALLITERATION</text><text x="298" y="394" font-size="20" fill="#f6f8f3" font-weight="700" font-style="italic">Big bold Boks</text><rect x="298" y="438" width="204" height="36" rx="18" fill="#c9a2ff"/><text x="400" y="462.12" font-size="17" fill="#10140f" font-weight="800" text-anchor="middle">same first sound</text><rect x="534" y="298" width="240" height="192" rx="14" fill="#123a24" stroke="#ffffff" stroke-width="4"/><text x="552" y="340" font-size="24" fill="#ffffff" font-weight="900">ONOMATOPOEIA</text><text x="552" y="394" font-size="20" fill="#f6f8f3" font-weight="700" font-style="italic">BANG! sizzle, buzz</text><rect x="552" y="438" width="204" height="36" rx="18" fill="#ffffff"/><text x="654" y="462.12" font-size="17" fill="#10140f" font-weight="800" text-anchor="middle">word = sound</text>
</svg>
