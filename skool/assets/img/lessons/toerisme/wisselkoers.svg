<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Toerisme · Buitelandse valuta: Koop- en verkoopkoers" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ahff6b57" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b57"/></marker><marker id="ah3ddc84" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc84"/></marker></defs>
<rect width="800" height="520" rx="18" fill="#071d11"/>
<rect width="800" height="72" rx="18" fill="#f2c94c"/><rect y="50" width="800" height="22" fill="#f2c94c"/>
<text x="24" y="27" font-size="15" fill="#1a1400" font-weight="800" letter-spacing="2">TOERISME · BUITELANDSE VALUTA</text>
<text x="24" y="60" font-size="29" fill="#1a1400" font-weight="900">Koop- en verkoopkoers</text>

    <rect x="130" y="90" width="540" height="70" rx="10" fill="#06120b" stroke="#f2c94c" stroke-width="3"/>
    <text x="400" y="112" font-size="15" fill="#b9d0c0" font-weight="700" text-anchor="middle">Bank se bord · USD $1 (voorbeeld)</text>
    <text x="150" y="146" font-size="22" fill="#3ddc84" font-weight="800" font-family="Consolas, 'Courier New', monospace">KOOP R17,80</text>
    <text x="650" y="146" font-size="22" fill="#ff6b57" font-weight="800" text-anchor="end" font-family="Consolas, 'Courier New', monospace">VERKOOP R18,60</text>
    <path d="M340,220 L400,184 L460,220 Z" fill="#f2c94c"/>
    <rect x="350" y="226" width="12" height="72" fill="#e9efe9"/><rect x="380" y="226" width="12" height="72" fill="#e9efe9"/><rect x="410" y="226" width="12" height="72" fill="#e9efe9"/><rect x="440" y="226" width="12" height="72" fill="#e9efe9"/>
    <rect x="336" y="298" width="128" height="14" fill="#f2c94c"/>
    <text x="400" y="340" font-size="22" fill="#f2c94c" font-weight="900" text-anchor="middle">BANK</text>
    <rect x="24" y="184" width="290" height="222" rx="14" fill="#123a24" stroke="#ff6b57" stroke-width="4"/>
    <text x="42" y="218" font-size="22" fill="#ff6b57" font-weight="900">✈ VERTREK</text>
    <text x="42" y="250" font-size="18" fill="#f6f8f3" font-weight="600"><tspan x="42" dy="0">Jy koop $ by die bank.</tspan><tspan x="42" dy="24">Bank VERKOOP →</tspan><tspan x="42" dy="24">gebruik verkoopkoers</tspan></text>
    <text x="42" y="352" font-size="24" fill="#ff6b57" font-weight="900">R → $ : DEEL</text>
    <text x="42" y="386" font-size="18" fill="#f2c94c" font-weight="800">R5 000 ÷ 18,60 = $268,82</text>
    <rect x="486" y="184" width="290" height="222" rx="14" fill="#123a24" stroke="#3ddc84" stroke-width="4"/>
    <text x="504" y="218" font-size="22" fill="#3ddc84" font-weight="900">⌂ TERUG</text>
    <text x="504" y="250" font-size="18" fill="#f6f8f3" font-weight="600"><tspan x="504" dy="0">Jy verkoop $ aan die bank.</tspan><tspan x="504" dy="24">Bank KOOP →</tspan><tspan x="504" dy="24">gebruik koopkoers</tspan></text>
    <text x="504" y="352" font-size="24" fill="#3ddc84" font-weight="900">$ → R : MAAL</text>
    <text x="504" y="386" font-size="18" fill="#f2c94c" font-weight="800">$100 × 17,80 = R1 780</text>
    <line x1="318" y1="260" x2="344" y2="260" stroke="#ff6b57" stroke-width="4" stroke-linecap="round" marker-end="url(#ahff6b57)"/><line x1="482" y1="260" x2="456" y2="260" stroke="#3ddc84" stroke-width="4" stroke-linecap="round" marker-end="url(#ah3ddc84)"/>
    <rect x="24" y="424" width="752" height="76" rx="14" fill="#f2c94c"/>
    <text x="400" y="458" font-size="21" fill="#10140f" font-weight="900" text-anchor="middle">Altyd uit die BANK se oog: bank koop laag, verkoop hoog</text>
    <text x="400" y="486" font-size="17" fill="#10140f" font-weight="700" text-anchor="middle">Trek kommissie af as die vraag dit gee</text>
</svg>
